name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: linux-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --bin transy-platform

      - name: Rename
        run: mv target/release/transy-platform transy-linux-x86_64

      - name: Upload Linux binary
        uses: softprops/action-gh-release@v1
        with:
          files: transy-linux-x86_64
          generate_release_notes: false

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: macos-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build x86_64
        run: cargo build --release --bin transy-platform --target x86_64-apple-darwin

      - name: Build ARM64
        run: cargo build --release --bin transy-platform --target aarch64-apple-darwin

      - name: Rename binaries
        run: |
          mv target/x86_64-apple-darwin/release/transy-platform transy-macos-intel
          mv target/aarch64-apple-darwin/release/transy-platform transy-macos-silicon

      - name: Upload macOS binaries
        uses: softprops/action-gh-release@v1
        with:
          files: |
            transy-macos-intel
            transy-macos-silicon
          generate_release_notes: false
