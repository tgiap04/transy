name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ github.ref_name }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get install -y pkg-config libxkbcommon-dev dpkg-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: linux-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Set version output
        id: version
        run: echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build .deb package
        run: |
          cargo install cargo-deb
          cargo deb -p transy-platform
          # Rename with version: transy_0.0.1_amd64.deb
          cp target/debian/*.deb "transy_${{ steps.version.outputs.VERSION_NUM }}_amd64.deb"

      - name: Upload .deb
        uses: softprops/action-gh-release@v1
        with:
          files: "transy_${{ steps.version.outputs.VERSION_NUM }}_amd64.deb"
          generate_release_notes: false

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: macos-cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Set version output
        id: version
        run: echo "VERSION_NUM=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Build .dmg (Intel)
        run: |
          mkdir -p /tmp/transy-dmg-intel
          cp target/x86_64-apple-darwin/release/transy-platform /tmp/transy-dmg-intel/
          echo "Transy v${{ steps.version.outputs.VERSION_NUM }} — On-demand pop-up translator" > /tmp/transy-dmg-intel/README.txt
          hdiutil create /tmp/transy-dmg-intel.dmg \
            -volname "Transy" \
            -fs HFS+ \
            -srcfolder /tmp/transy-dmg-intel \
            -format UDZO
          mv /tmp/transy-dmg-intel.dmg "transy_${{ steps.version.outputs.VERSION_NUM }}_intel_x86_64.dmg"

      - name: Build .dmg (Silicon)
        run: |
          mkdir -p /tmp/transy-dmg-silicon
          cp target/aarch64-apple-darwin/release/transy-platform /tmp/transy-dmg-silicon/
          echo "Transy v${{ steps.version.outputs.VERSION_NUM }} — On-demand pop-up translator" > /tmp/transy-dmg-silicon/README.txt
          hdiutil create /tmp/transy-dmg-silicon.dmg \
            -volname "Transy" \
            -fs HFS+ \
            -srcfolder /tmp/transy-dmg-silicon \
            -format UDZO
          mv /tmp/transy-dmg-silicon.dmg "transy_${{ steps.version.outputs.VERSION_NUM }}_silicon_aarch64.dmg"

      - name: Upload DMG files
        uses: softprops/action-gh-release@v1
        with:
          files: |
            transy_${{ steps.version.outputs.VERSION_NUM }}_intel_x86_64.dmg
            transy_${{ steps.version.outputs.VERSION_NUM }}_silicon_aarch64.dmg
          generate_release_notes: false
