name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Linux system dependencies
        run: sudo apt-get install -y pkg-config libssl-dev libxkbcommon-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: cargo-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build Linux binary
        run: cargo build --release --bin transy-platform

      - name: Build macOS x86_64
        run: cargo build --release --bin transy-platform --target x86_64-apple-darwin

      - name: Build macOS ARM64
        run: cargo build --release --bin transy-platform --target aarch64-apple-darwin

      - name: Create macOS universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/transy-platform \
            target/aarch64-apple-darwin/release/transy-platform \
            -output transy-macos-universal

      - name: Rename Linux binary
        run: mv target/release/transy-platform transy-linux-x86_64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            transy-linux-x86_64
            transy-macos-universal
          generate_release_notes: true
