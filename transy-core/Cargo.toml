[package]
name = "transy-core"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Read the PRIMARY selection natively via the X server. On Wayland this goes
# through XWayland (which bridges the selection), so no external clipboard
# binary (wl-paste/xclip) needs to be installed by the user.
[target.'cfg(target_os = "linux")'.dependencies]
x11-clipboard = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
